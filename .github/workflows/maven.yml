name: Java CI with Maven and Docker in Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    env:
      DOCKER_HOST: tcp://localhost:2375

    name: Build in Windows
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Cache Maven packages
      uses: actions/cache@v2
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
        restore-keys: ${{ runner.os }}-m2-
    - name: Configure Docker Service
      run: sc config docker binpath="\"C:\\Program Files\\Docker\\Docker\\resources\\bin\\dockerd.exe\" --run-service -H tcp://localhost:2375"
    - name: Start Docker Service
      run: Start-Service docker
    - name: Verify Docker Service Status
      run: Get-Service docker
    - name: Docker info
      run: docker info
    - name: Build with Maven
      run: mvn verify -Pskip-testcontainers
      working-directory: com.example.school
