name: Java CI with Maven and Docker in Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Cache Maven packages
      uses: actions/cache@v2
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
        restore-keys: ${{ runner.os }}-m2-
    - name: Configure Docker Service for TCP
      run: |
        sc config docker binPath=^"C:\\Program Files\\Docker\\Docker\\resources\\bin\\dockerd.exe --run-service -H tcp://0.0.0.0:2375 -H npipe://^"
        Start-Service docker
    - name: Verify Docker Listening on TCP
      run: |
        netstat -an | findstr 2375
    - name: Docker info
      run: docker info
    - name: Build with Maven
      run: mvn verify -Pskip-testcontainers
      working-directory: com.example.school